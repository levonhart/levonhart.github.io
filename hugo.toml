baseURL = 'https://levonhart.github.io/'
locale = 'en-us'
title = 'Leonardo de Abreu'
enableRobotsTXT = false
enableGitInfo = true

theme = 'PaperMod'

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = 'Leonardo de Abreu, LIRMM'
description = "Leonardo de Abreu, LIRMM"
keywords = [ "Blog", "Portfolio", "PaperMod" ]
author = "Leonardo de Abreu"
images = [ "<link or path of image for opengraph, twitter-cards>" ]
DateFormat = "2 January, 2006"
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = false
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
hideFooter = false
showtoc = false
tocopen = false

[params.assets]
favicon = "<link / abs url>"
favicon16x16 = "<link / abs url>"
favicon32x32 = "<link / abs url>"
apple_touch_icon = "<link / abs url>"
safari_pinned_tab = "<link / abs url>"

[params.label]
text = "abreu"
icon = "/apple-touch-icon.png"
iconHeight = 35

[params.profileMode]
enabled = false
imageUrl = "img/profile.jpeg"
imageWidth = 180
imageHeight = 180
imageTitle = "Author's picture"

[[params.profileMode.buttons]]
name = "Posts"
url = "posts"

[[params.profileMode.buttons]]
name = "Tags"
url = "tags"

[params.homeInfoParams]
Title = "Leonardo de Abreu"
Content = """
PhD Student @ LIRMM \\
University of Montpellier / CNRS
"""

